appId: com.kk.pricompare
productName: 询价比价系统
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: '询价比价系统-Setup-${version}.${ext}'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 询价比价系统
  deleteAppDataOnUninstall: false
# 网络下载 Electron 慢时可启用国内镜像：
# electronDownload:
#   mirror: https://npmmirror.com/mirrors/electron/
