appId: com.kk.pricompare
productName: 询价比价系统
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: '询价比价系统-Setup-${version}.${ext}'
  # 在 Linux 容器交叉打包时跳过 exe 资源编辑与签名（否则需要 wine 跑 signtool）。
  # 代价：安装包/主程序保留 Electron 默认图标与版本元数据，功能不受影响。
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 询价比价系统
  deleteAppDataOnUninstall: false
# 网络下载 Electron 慢时可启用国内镜像：
# electronDownload:
#   mirror: https://npmmirror.com/mirrors/electron/
